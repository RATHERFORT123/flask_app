version: "3.9"

services:

  web:
    build: .

    container_name: flask_web

    restart: always

    command: gunicorn --bind 0.0.0.0:5000 wsgi:app

    ports:
      - "5000:5000"

    env_file:
      - .env

    depends_on:
      - db
      - redis

    volumes:
      - .:/app

  db:
    image: postgres:15

    container_name: flask_db

    restart: always

    environment:
      POSTGRES_DB: flaskdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

    container_name: redis

    restart: always

    ports:
      - "6379:6379"

  worker:
    build: .

    container_name: celery_worker

    restart: always

    command: celery -A app.celery_app worker --loglevel=info

    entrypoint: []

    env_file:
      - .env

    depends_on:
      - redis
      - db

    volumes:
      - .:/app
volumes:
  postgres_data: