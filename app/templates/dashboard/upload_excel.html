{% extends "base.html" %}
{% block content %}

<div class="container mt-4">

    <h3>Excel Bulk Upload</h3>

    <div class="form-group mb-3">
        <label for="file_type" class="form-label fw-bold">Select Data Type:</label>
        <select id="file_type" class="form-control">
            <option value="contract">Contracts Data</option>
            <option value="seller">Seller Data</option>
        </select>
    </div>
    
    <input type="hidden" id="csrf_token" value="{{ csrf_token() }}">
    
    <div class="card p-4 bg-light mb-3">
        <label for="fileElem" class="form-label fw-bold">Choose Excel Files to Upload:</label>
        <input type="file" id="fileElem" class="form-control" multiple accept=".xlsx,.xls">
    </div>

    <div class="progress mt-3" style="height:25px;">
        <div id="progress-bar" class="progress-bar" style="width:0%">0%</div>
    </div>

    <div id="upload-status" class="mt-3"></div>

</div>

<script>
let fileInput = document.getElementById("fileElem");

// Listen for standard file selection input
fileInput.addEventListener("change", () => {
    uploadFiles(fileInput.files);
});

// Helper function to reset UI cleanly for subsequent uploads
function resetUploadUI() {
    let bar = document.getElementById("progress-bar");
    bar.style.width = "0%";
    bar.innerText = "0%";
    document.getElementById("upload-status").innerHTML = "";
    fileInput.value = ""; // Clears file memory so same file can be picked again
}

function uploadFiles(files) {
    if (files.length === 0) return;

    let formData = new FormData();

    for (let i = 0; i < files.length; i++) {
        formData.append("files", files[i]);
    }

    formData.append("file_type", document.getElementById("file_type").value);
    let csrfToken = document.getElementById("csrf_token").value;

    let bar = document.getElementById("progress-bar");

    let xhr = new XMLHttpRequest();
    xhr.open("POST", "{{ url_for('upload.upload_excel') }}", true);
    xhr.setRequestHeader("X-CSRFToken", csrfToken);

    // Track Progress
    xhr.upload.onprogress = function(e) {
        if (e.lengthComputable) {
            let percent = (e.loaded / e.total) * 100;
            bar.style.width = percent + "%";
            bar.innerText = Math.round(percent) + "%";
        }
    };

    // Handle Upload Completion
    xhr.onload = function() {
        if (xhr.status === 200) {
            let res = JSON.parse(xhr.responseText);
            if (res.status === "success") {
                // Success banner with a button to seamlessly upload more files
                document.getElementById("upload-status").innerHTML = `
                    <div class='alert alert-success d-flex justify-content-between align-items-center'>
                        <span><strong>Success!</strong> Upload Complete.</span>
                        <button class='btn btn-success btn-sm' onclick='resetUploadUI();'>Upload More Files</button>
                    </div>`;
            } else {
                document.getElementById("upload-status").innerHTML =
                    "<div class='alert alert-danger'>" + (res.message || "Upload Failed") + "</div>";
                fileInput.value = ""; 
            }
        } else {
            document.getElementById("upload-status").innerHTML =
                "<div class='alert alert-danger'>Upload Failed (Server Error)</div>";
            fileInput.value = "";
        }
    };

    xhr.send(formData);
}
</script>

{% endblock %}
