{% extends "base.html" %}
{% block title %}Contract Excel Processor{% endblock %}

{% block content %}
<div class="container mt-4">

<div class="card shadow-sm">
<div class="card-body">

<h4 class="mb-3">Contract Excel Processor</h4>

<button class="btn btn-primary" id="btnPending">
Process Pending Excel
</button>

<button class="btn btn-danger ms-2" id="btnRetry">
Retry ALL Failed
</button>

<div class="mt-3 text-muted" id="status">
Idle
</div>


<table class="table table-bordered table-sm mt-3">

<thead>
<tr>
<th>File</th>
<th>Status</th>
<th>Inserted</th>
<th>Failed</th>
<th>Updated</th>
<th>Action</th>
</tr>
</thead>

<tbody id="progressTable">
<tr>
<td colspan="6" class="text-center text-muted">
No data yet
</td>
</tr>
</tbody>

</table>

</div>
</div>
</div>

<meta name="csrf-token" content="{{ csrf_token() }}">


<script>

const csrfToken =
document.querySelector('meta[name="csrf-token"]').getAttribute('content')

let progressTimer = null


function startPolling(){
if(!progressTimer){
progressTimer = setInterval(loadProgress,2000)
}
}


function stopPolling(){
if(progressTimer){
clearInterval(progressTimer)
progressTimer = null
}
}


function post(url){

document.getElementById("status").innerText = "Processing..."

fetch(url,{
method:"POST",
headers:{
"X-CSRFToken": csrfToken
}
})
.then(r=>r.json())
.then(d=>{
document.getElementById("status").innerText =
"Status: " + (d.status || "started")
})
.catch(()=>{
document.getElementById("status").innerText =
"Server error"
})

}


document.getElementById("btnPending").onclick = ()=>{
startPolling()
post("/admin/contracts/process-pending")
}


document.getElementById("btnRetry").onclick = ()=>{
startPolling()
post("/admin/contracts/retry-all")
}



function processFile(filename){

document.getElementById("status").innerText =
"Processing file: " + filename

fetch("/admin/contracts/process-file/"+filename,{
method:"POST",
headers:{
"X-CSRFToken": csrfToken
}
})
.then(r=>r.json())
.then(()=>{
startPolling()
})
.catch(()=>{
document.getElementById("status").innerText =
"Error processing file"
})

}



function loadProgress(){

fetch("/admin/contracts/progress")

.then(r=>r.json())

.then(data=>{

const tbody = document.getElementById("progressTable")

tbody.innerHTML=""

const files = Object.keys(data).filter(k=>k!=="_system")

if(files.length===0){

tbody.innerHTML=
`
<tr>
<td colspan="6" class="text-center text-muted">
No progress data
</td>
</tr>
`

return
}


files.forEach(file=>{

const d = data[file]

let btn = ""

if(d.status !== "completed"){
btn =
`<button class="btn btn-sm btn-success"
onclick="processFile('${file}')">
Process
</button>`
}

tbody.innerHTML +=
`
<tr>
<td>${file}</td>
<td>${d.status}</td>
<td>${d.inserted}</td>
<td>${d.failed}</td>
<td>${d.updated}</td>
<td>${btn}</td>
</tr>
`

})


if(data._system && data._system.status==="idle"){
document.getElementById("status").innerText =
"Idle – No pending contract files"
stopPolling()
}

})

.catch(()=>{
stopPolling()
})

}
startPolling();
</script>

{% endblock %}
